services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hirematch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Atur POSTGRES_PASSWORD di .env.local}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hirematch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hirematch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hirematch_postgres:
